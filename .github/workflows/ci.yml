name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build:lib
      - run: npm pack --dry-run ./dist/webmcp
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - name: Verify documentation assets
        run: |
          test -f dist/demo/browser/assets/webmcp-logo.svg
          test -f dist/demo/browser/assets/taiga-ui/icons/search.svg
          test -f dist/demo/browser/assets/taiga-ui/icons/chevron-down.svg
