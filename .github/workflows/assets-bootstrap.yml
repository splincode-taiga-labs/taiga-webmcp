name: Update demo assets lockfile (temporary)
on:
  push:
    branches: [fix/docs-icons-code-overflow]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: npm install --no-audit --no-fund
      - run: npm run format
      - name: Update lockfile and remove temporary workflow
        run: |
          git rm .github/workflows/assets-bootstrap.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock icons dependency and format demo assets"
            git push
          fi
