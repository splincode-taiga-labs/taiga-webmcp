name: Initialize Playwright dependencies (temporary)
on:
  push:
    branches: [test/playwright-docs-smoke]
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: npm install --no-audit --no-fund
      - run: npm run format
      - name: Commit lockfile and formatting, remove workflow
        run: |
          git rm .github/workflows/playwright-bootstrap.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock Playwright and format smoke tests"
            git push
          fi
