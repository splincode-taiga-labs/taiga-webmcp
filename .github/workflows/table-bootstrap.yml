name: Initialize table tools (temporary)
on:
  push:
    branches: [feat/table-webmcp-tools]
permissions:
  contents: write
jobs:
  format-and-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: npm install --no-audit --no-fund
      - run: npm run lint:fix || true
      - run: npm run format
      - name: Commit generated lockfile and formatting
        run: |
          git rm .github/workflows/table-bootstrap.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore: align formatting and lockfile for table tools"
            git push
          fi
