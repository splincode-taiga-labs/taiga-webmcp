name: Prettier bootstrap (temporary)
on:
  push:
    branches:
      - chore/add-prettier
permissions:
  contents: write
jobs:
  format-initial-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - run: npm install --no-audit --no-fund
      - run: npm run format
      - name: Commit formatted baseline and remove temporary workflow
        run: |
          git rm .github/workflows/prettier-bootstrap.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "style: format codebase with Prettier"
            git push
          fi
